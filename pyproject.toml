[project]
name = "sql-injection-sentinel"
version = "0.1.0"
description = "Continuous SQLi scanner powered by MiMo multi-agent reasoning."
authors = [{name = "SQL Injection Sentinel contributors"}]
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
dependencies = [
    "httpx>=0.27",
    "pydantic>=2.5",
    "pyyaml>=6.0",
    "openapi-spec-validator>=0.7",
    "tenacity>=8.2",
    "click>=8.1",
    "rich>=13.7",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.4", "mypy>=1.10", "types-PyYAML>=6.0"]

[project.scripts]
sentinel = "sentinel.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sentinel"]

[tool.hatch.build.targets.sdist]
include = [
    "src/sentinel",
    "tests",
    "README.md",
    "LICENSE",
    "PROMPTS.md",
    "ARCHITECTURE.md",
    "GRANT_PITCH.md",
    "TOKEN_USAGE.md",
    ".env.example",
]

[tool.ruff]
line-length = 100
target-version = "py310"
